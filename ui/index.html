<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Luna - Guarded RAG</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,opsz,wght@0,9..144,400;0,9..144,500;0,9..144,600;1,9..144,400&family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet" />
<style>
  :root {
    --canvas: #FAF6F0;
    --paper: #F4ECE1;
    --paper-soft: #F0E3D5;
    --paper-border: #EAD6C4;
    --hairline: #E7DCCC;
    --ink: #1A1A1A;
    --ink-soft: #6B6258;
    --accent: #C4552F;
    --accent-deep: #A8421F;
    --code-bg: #262019;
    --code-header: #1F1A15;
    --code-keyword: #E39B6E;
    --code-string: #C9B78E;
    --code-comment: #8A7E6C;
    --code-function: #EAD9BE;
    --radius: 16px;
  }
  * { margin: 0; padding: 0; box-sizing: border-box; }
  html, body { height: 100%; }
  body {
    font-family: "Inter", system-ui, sans-serif;
    background: var(--canvas);
    color: var(--ink);
    font-size: 15px;
    line-height: 1.6;
    -webkit-font-smoothing: antialiased;
  }
  .app { display: flex; height: 100vh; overflow: hidden; }

  /* ---------- Sidebar ---------- */
  .sidebar {
    width: 264px;
    flex-shrink: 0;
    background: var(--paper);
    border-right: 1px solid var(--hairline);
    display: flex;
    flex-direction: column;
    padding: 16px 12px;
  }
  .brand { display: flex; align-items: center; gap: 10px; padding: 4px 6px 14px; }
  .brand-mark {
    width: 28px; height: 28px; border-radius: 8px;
    background: var(--accent);
    display: grid; place-items: center;
    color: #fff; font-size: 14px;
  }
  .brand-name {
    font-family: "Fraunces", serif;
    font-size: 20px;
    font-weight: 600;
    letter-spacing: -0.01em;
  }
  .new-chat {
    width: 100%;
    display: flex; align-items: center; justify-content: space-between;
    background: var(--accent);
    color: #fff;
    border: none;
    border-radius: 10px;
    padding: 10px 12px;
    font-family: "Inter", sans-serif;
    font-size: 13.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .new-chat:hover { background: var(--accent-deep); }
  .new-chat .kbd {
    font-family: "JetBrains Mono", monospace;
    font-size: 11px;
    opacity: 0.85;
  }
  .search {
    margin-top: 12px;
    width: 100%;
    padding: 8px 10px;
    border: 1px solid var(--hairline);
    border-radius: 8px;
    background: var(--canvas);
    font-family: "Inter", sans-serif;
    font-size: 13px;
    color: var(--ink);
    outline: none;
  }
  .search::placeholder { color: var(--ink-soft); }
  .history { flex: 1; overflow-y: auto; margin-top: 12px; }
  .history-group {
    font-size: 11px;
    font-weight: 600;
    letter-spacing: 0.08em;
    text-transform: uppercase;
    color: var(--ink-soft);
    padding: 10px 8px 6px;
  }
  .chat-row {
    display: flex; align-items: center; gap: 8px;
    padding: 8px;
    border-radius: 8px;
    cursor: pointer;
    font-size: 13px;
    color: var(--ink);
    white-space: nowrap; overflow: hidden; text-overflow: ellipsis;
  }
  .chat-row:hover { background: var(--canvas); }
  .chat-row.active {
    background: var(--paper-soft);
    border: 1px solid var(--paper-border);
  }
  .chat-row .ico { color: var(--accent); font-size: 13px; flex-shrink: 0; }
  .chat-row .label { overflow: hidden; text-overflow: ellipsis; }
  .account {
    display: flex; align-items: center; gap: 10px;
    border-top: 1px solid var(--hairline);
    padding: 12px 6px 0;
    margin-top: 8px;
  }
  .avatar {
    width: 30px; height: 30px; border-radius: 50%;
    background: var(--ink); color: var(--canvas);
    display: grid; place-items: center;
    font-size: 12px; font-weight: 600;
  }
  .account .meta { flex: 1; overflow: hidden; }
  .account .name { font-size: 13px; font-weight: 500; }
  .account .plan { font-size: 11px; color: var(--ink-soft); }
  .account .gear { color: var(--ink-soft); cursor: pointer; }
  .ingest-btn {
    width: 100%;
    margin-top: 10px;
    padding: 8px 10px;
    border: 1px dashed var(--paper-border);
    border-radius: 8px;
    background: var(--canvas);
    color: var(--accent-deep);
    font-family: "Inter", sans-serif;
    font-size: 12.5px;
    font-weight: 500;
    cursor: pointer;
    transition: background 0.15s ease;
  }
  .ingest-btn:hover { background: var(--paper-soft); }

  /* ---------- Main ---------- */
  .main { flex: 1; display: flex; flex-direction: column; min-width: 0; }
  .topbar {
    position: sticky; top: 0;
    display: flex; align-items: center; justify-content: space-between;
    padding: 12px 20px;
    background: rgba(250, 246, 240, 0.8);
    backdrop-filter: blur(8px);
    border-bottom: 1px solid var(--hairline);
    z-index: 5;
  }
  .topbar .title {
    font-family: "Fraunces", serif;
    font-size: 18px;
    font-weight: 500;
  }
  .topbar .actions { display: flex; gap: 6px; }
  .icon-btn {
    background: transparent; border: none;
    color: var(--ink-soft); font-size: 16px;
    padding: 6px 8px; border-radius: 8px; cursor: pointer;
  }
  .icon-btn:hover { background: var(--paper); color: var(--ink); }
  .hamburger { display: none; }

  .thread-wrap { flex: 1; overflow-y: auto; }
  .thread { max-width: 760px; margin: 0 auto; padding: 20px 24px 140px; }

  .date-sep {
    display: flex; align-items: center; gap: 12px;
    color: var(--ink-soft); font-size: 11px; font-weight: 500;
    letter-spacing: 0.06em; text-transform: uppercase;
    margin: 8px 0 24px;
  }
  .date-sep::before, .date-sep::after {
    content: ""; flex: 1; height: 1px; background: var(--hairline);
  }

  .msg-user {
    display: flex; justify-content: flex-end; margin-bottom: 22px;
  }
  .msg-user .bubble {
    max-width: 85%;
    background: var(--paper-soft);
    border: 1px solid var(--paper-border);
    border-radius: var(--radius);
    border-top-right-radius: 4px;
    padding: 12px 16px;
    font-size: 14.5px;
  }

  .msg-assistant { display: flex; flex-direction: column; margin-bottom: 26px; }
  .assistant-head {
    display: flex; align-items: center; gap: 8px;
    margin-bottom: 6px;
  }
  .assistant-mark {
    width: 20px; height: 20px; border-radius: 6px;
    background: var(--accent);
    display: grid; place-items: center;
    color: #fff; font-size: 10px;
  }
  .assistant-name {
    font-family: "Fraunces", serif;
    font-style: italic;
    font-size: 14px;
    color: var(--accent-deep);
  }
  .assistant-body p { margin-bottom: 12px; }
  .assistant-body ol { margin: 0 0 12px 20px; }
  .assistant-body ol li { margin-bottom: 6px; }
  .assistant-body ol li::marker {
    font-family: "Fraunces", serif;
    color: var(--accent);
  }
  .assistant-body ul { margin: 0 0 12px 20px; list-style: none; }
  .assistant-body ul li::before {
    content: "✓ "; color: var(--accent);
    font-weight: 600;
  }
  .assistant-body code.inline {
    background: var(--paper);
    color: var(--accent-deep);
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
    padding: 2px 5px;
    border-radius: 4px;
  }
  .assistant-body .cite {
    color: var(--accent);
    font-family: "JetBrains Mono", monospace;
    font-size: 12px;
  }

  .code-block {
    background: var(--code-bg);
    border-radius: 12px;
    overflow: hidden;
    margin: 12px 0;
    font-family: "JetBrains Mono", monospace;
    font-size: 12.5px;
  }
  .code-block .code-head {
    display: flex; justify-content: space-between; align-items: center;
    background: var(--code-header);
    padding: 8px 14px;
    color: var(--paper);
    font-size: 12px;
  }
  .code-block .code-head .copy {
    background: transparent; border: none; color: var(--code-string);
    cursor: pointer; font-size: 12px; font-family: inherit;
  }
  .code-block pre {
    padding: 14px;
    overflow-x: auto;
    color: var(--paper);
  }
  .code-block .kw { color: var(--code-keyword); }
  .code-block .st { color: var(--code-string); }
  .code-block .cm { color: var(--code-comment); }
  .code-block .fn { color: var(--code-function); }

  .refusal {
    border: 1px solid var(--paper-border);
    background: var(--paper);
    border-radius: 12px;
    padding: 14px 16px;
    color: var(--ink);
    font-size: 14px;
  }
  .refusal .tag {
    display: inline-block;
    font-size: 11px; font-weight: 600; letter-spacing: 0.05em;
    color: var(--accent-deep);
    text-transform: uppercase;
    margin-bottom: 6px;
  }

  .assistant-actions {
    display: flex; gap: 4px; margin-top: 8px; opacity: 0; transition: opacity 0.15s;
  }
  .msg-assistant:hover .assistant-actions { opacity: 1; }
  .assistant-actions button {
    background: transparent; border: none; color: var(--ink-soft);
    font-size: 13px; padding: 4px 8px; border-radius: 6px; cursor: pointer;
  }
  .assistant-actions button:hover { background: var(--paper); color: var(--ink); }

  .typing { display: flex; gap: 5px; padding: 8px 2px; }
  .typing span {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
    animation: bounce 1.2s infinite ease-in-out;
  }
  .typing span:nth-child(2) { animation-delay: 0.15s; }
  .typing span:nth-child(3) { animation-delay: 0.3s; }
  @keyframes bounce { 0%, 100% { transform: translateY(0); opacity: 0.4; } 50% { transform: translateY(-5px); opacity: 1; } }

  /* ---------- Composer ---------- */
  .composer-wrap {
    position: sticky; bottom: 0;
    background: rgba(250, 246, 240, 0.9);
    backdrop-filter: blur(10px);
    padding: 12px 24px 16px;
    z-index: 5;
  }
  .composer {
    max-width: 760px; margin: 0 auto;
    background: var(--canvas);
    border: 1px solid var(--hairline);
    border-radius: var(--radius);
    box-shadow: 0 8px 24px rgba(26, 26, 26, 0.06);
    padding: 12px 14px;
  }
  .composer textarea {
    width: 100%;
    border: none; outline: none; resize: none;
    background: transparent;
    font-family: "Inter", sans-serif;
    font-size: 14.5px;
    color: var(--ink);
    max-height: 160px;
    min-height: 24px;
  }
  .composer textarea::placeholder { color: var(--ink-soft); }
  .composer-row {
    display: flex; align-items: center; justify-content: space-between;
    margin-top: 8px;
  }
  .composer-left { display: flex; align-items: center; gap: 8px; }
  .attach-btn {
    background: transparent; border: none; color: var(--ink-soft);
    font-size: 15px; cursor: pointer; padding: 4px;
  }
  .attach-btn:hover { color: var(--accent); }
  .model-chip {
    display: flex; align-items: center; gap: 6px;
    border: 1px solid var(--hairline);
    background: var(--paper);
    border-radius: 999px;
    padding: 4px 12px;
    font-size: 12px;
    color: var(--ink);
    cursor: pointer;
  }
  .model-chip .dot {
    width: 7px; height: 7px; border-radius: 50%;
    background: var(--accent);
  }
  .send-hint { font-size: 12px; color: var(--ink-soft); }
  .send-btn {
    width: 34px; height: 34px; border-radius: 50%;
    background: var(--accent); color: #fff;
    border: none; cursor: pointer;
    display: grid; place-items: center;
    font-size: 15px;
    transition: background 0.15s ease;
  }
  .send-btn:hover { background: var(--accent-deep); }
  .send-btn:disabled { opacity: 0.5; cursor: not-allowed; }
  .disclaimer {
    text-align: center;
    font-size: 11.5px;
    color: var(--ink-soft);
    margin-top: 8px;
  }

  /* ---------- Ingest status ---------- */
  .ingest-toast {
    position: fixed; bottom: 110px; left: 50%; transform: translateX(-50%);
    background: var(--ink); color: var(--canvas);
    border-radius: 10px;
    padding: 10px 16px;
    font-size: 13px;
    z-index: 50;
    box-shadow: 0 8px 24px rgba(26, 26, 26, 0.2);
    max-width: 480px;
    display: none;
  }

  /* ---------- Mobile ---------- */
  @media (max-width: 768px) {
    .sidebar {
      position: fixed; z-index: 40; height: 100%;
      transform: translateX(-100%);
      transition: transform 0.2s ease;
    }
    .sidebar.open { transform: translateX(0); }
    .hamburger { display: inline-block; }
    .thread { padding: 16px 16px 120px; }
  }
</style>
</head>
<body>
<div class="app">
  <!-- Sidebar -->
  <aside class="sidebar" id="sidebar">
    <div class="brand">
      <div class="brand-mark">✦</div>
      <div class="brand-name">Luna</div>
    </div>
    <button class="new-chat" id="newChat">＋ New conversation <span class="kbd">⌘N</span></button>
    <input class="search" id="chatSearch" placeholder="Search chats" />
    <div class="history" id="history"></div>
    <input type="file" id="fileInput" multiple accept=".pdf,.txt,.md" style="display:none" />
    <button class="ingest-btn" id="ingestBtn">＋ Ingest documents (PDF / txt / md)</button>
    <div class="account">
      <div class="avatar">AL</div>
      <div class="meta">
        <div class="name">Adham</div>
        <div class="plan">Luna · Guarded</div>
      </div>
      <span class="gear">⚙</span>
    </div>
  </aside>

  <!-- Main -->
  <main class="main">
    <div class="topbar">
      <div class="actions">
        <button class="icon-btn hamburger" id="hamburger">☰</button>
      </div>
      <div class="title" id="conversationTitle">New conversation</div>
      <div class="actions">
        <button class="icon-btn" title="History">🕘</button>
        <button class="icon-btn" title="Share">↗</button>
        <button class="icon-btn" title="More">⋯</button>
      </div>
    </div>

    <div class="thread-wrap">
      <div class="thread" id="thread">
        <div class="date-sep" id="dateSep"></div>
      </div>
    </div>

    <div class="composer-wrap">
      <div class="composer">
        <textarea id="input" rows="1" placeholder="Ask your documents…"></textarea>
        <div class="composer-row">
          <div class="composer-left">
            <button class="attach-btn" id="attachBtn" title="Attach file">📎</button>
            <button class="model-chip" id="modelChip" title="Model">
              <span class="dot"></span> Luna · Guarded <span style="font-size:10px">▾</span>
            </button>
          </div>
          <div class="composer-left">
            <span class="send-hint">⏎ to send</span>
            <button class="send-btn" id="sendBtn" title="Send">↑</button>
          </div>
        </div>
      </div>
      <div class="disclaimer">Luna answers only from your documents. Luna can make mistakes. Double-check important info.</div>
    </div>
  </main>
</div>

<div class="ingest-toast" id="ingestToast"></div>

<script>
"use strict";

/* ---------- tiny markdown-ish renderer (code blocks, inline code, lists) ---------- */
function escapeHtml(s) {
  return s.replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;");
}
function renderInline(s) {
  s = escapeHtml(s);
  s = s.replace(/`([^`]+)`/g, '<code class="inline">$1</code>');
  s = s.replace(/\[(\d+)\]/g, '<span class="cite">[$1]</span>');
  s = s.replace(/\*\*([^*]+)\*\*/g, "<strong>$1</strong>");
  return s;
}
function highlightCode(code) {
  const esc = escapeHtml(code);
  const lines = esc.split("\n");
  return lines.map(line =>
    line
      .replace(/("[^"]*"|'[^']*')/g, '<span class="st">$1</span>')
      .replace(/\b(def|class|import|from|return|if|else|for|while|with|lambda|async|await)\b/g, '<span class="kw">$1</span>')
      .replace(/(#[^\n]*)$/, '<span class="cm">$1</span>')
  ).join("\n");
}
function renderAnswer(text) {
  const blocks = [];
  const parts = text.split(/```/);
  parts.forEach((part, i) => {
    if (i % 2 === 1) {
      const lines = part.split("\n");
      const lang = (lines[0] || "").trim().split(" ")[0];
      const code = lines.slice(1).join("\n");
      blocks.push({ kind: "code", lang, code });
    } else if (part.trim()) {
      part.split(/\n{2,}/).forEach(p => blocks.push({ kind: "p", text: p.trim() }));
    }
  });
  let html = "";
  for (const b of blocks) {
    if (b.kind === "code") {
      html += `<div class="code-block"><div class="code-head"><span>${escapeHtml(b.lang || "code")}</span><button class="copy" onclick="copyCode(this)">Copy</button></div><pre>${highlightCode(b.code)}</pre></div>`;
    } else {
      const t = b.text;
      if (/^\d+\.\s/m.test(t)) {
        const items = t.split(/\n(?=\d+\.\s)/).map(x => x.replace(/^\d+\.\s/, ""));
        html += "<ol>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ol>";
      } else if (/^[-*]\s/m.test(t)) {
        const items = t.split(/\n(?=[-*]\s)/).map(x => x.replace(/^[-*]\s/, ""));
        html += "<ul>" + items.map(i => `<li>${renderInline(i)}</li>`).join("") + "</ul>";
      } else {
        html += `<p>${renderInline(t)}</p>`;
      }
    }
  }
  return html;
}
function copyCode(btn) {
  const pre = btn.closest(".code-block").querySelector("pre");
  navigator.clipboard.writeText(pre.textContent);
  btn.textContent = "Copied ✓";
  setTimeout(() => (btn.textContent = "Copy"), 1500);
}

/* ---------- state ---------- */
const state = { conversations: JSON.parse(localStorage.getItem("luna_chats") || "[]"), activeId: null };
function todayLabel() {
  const d = new Date();
  const t = d.toLocaleTimeString([], { hour: "2-digit", minute: "2-digit" });
  return `TODAY · ${t}`;
}
function save() { localStorage.setItem("luna_chats", JSON.stringify(state.conversations)); }

/* ---------- rendering history ---------- */
function renderHistory() {
  const el = document.getElementById("history");
  if (!state.conversations.length) { el.innerHTML = `<div class="history-group">No conversations yet</div>`; return; }
  const today = new Date().toDateString();
  const groups = { TODAY: [], YESTERDAY: [], OLDER: [] };
  state.conversations.forEach(c => {
    const d = new Date(c.created);
    const ds = d.toDateString();
    if (ds === today) groups.TODAY.push(c);
    else if (Date.now() - d.getTime() < 86400000 * 2) groups.YESTERDAY.push(c);
    else groups.OLDER.push(c);
  });
  let html = "";
  for (const [label, items] of Object.entries(groups)) {
    if (!items.length) continue;
    html += `<div class="history-group">${label}</div>`;
    for (const c of items) {
      const title = c.title || c.messages[0]?.text?.slice(0, 40) || "Chat";
      html += `<div class="chat-row ${c.id === state.activeId ? "active" : ""}" data-id="${c.id}">
        <span class="ico">💬</span><span class="label">${escapeHtml(title)}</span>
      </div>`;
    }
  }
  el.innerHTML = html;
  el.querySelectorAll(".chat-row").forEach(row => row.addEventListener("click", () => openConversation(row.dataset.id)));
}

/* ---------- conversations ---------- */
function newConversation() {
  state.activeId = "c" + Date.now();
  state.conversations.unshift({ id: state.activeId, created: Date.now(), title: "", messages: [] });
  save(); renderHistory();
  document.getElementById("thread").innerHTML = `<div class="date-sep">${todayLabel()}</div>`;
  document.getElementById("conversationTitle").textContent = "New conversation";
}
function openConversation(id) {
  state.activeId = id;
  const conv = state.conversations.find(c => c.id === id);
  if (!conv) return;
  document.getElementById("conversationTitle").textContent = conv.title || "Conversation";
  renderThread(conv.messages);
  renderHistory();
}
function getActive() { return state.conversations.find(c => c.id === state.activeId); }
function renderThread(messages) {
  const el = document.getElementById("thread");
  let html = `<div class="date-sep">${todayLabel()}</div>`;
  for (const m of messages) {
    if (m.role === "user") {
      html += `<div class="msg-user"><div class="bubble">${renderInline(m.text)}</div></div>`;
    } else {
      html += `<div class="msg-assistant"><div class="assistant-head"><div class="assistant-mark">✦</div><span class="assistant-name">Luna</span></div>`;
      html += m.refused
        ? `<div class="refusal"><span class="tag">Not in your documents</span><br>${renderInline(m.text)}</div>`
        : `<div class="assistant-body">${renderAnswer(m.text)}</div>`;
      html += `<div class="assistant-actions">
        <button title="Copy" onclick="copyAnswer(this)">Copy</button>
        <button title="Good">👍</button><button title="Bad">👎</button><button title="Regenerate">↻</button>
      </div></div>`;
    }
  }
  el.innerHTML = html;
  el.parentElement.scrollTop = el.parentElement.scrollHeight;
}
function copyAnswer(btn) {
  const body = btn.closest(".msg-assistant").querySelector(".assistant-body, .refusal");
  navigator.clipboard.writeText(body.textContent.trim());
  btn.textContent = "Copied ✓";
  setTimeout(() => (btn.textContent = "Copy"), 1500);
}

/* ---------- ask ---------- */
async function ask(question) {
  const res = await fetch("/api/ask", {
    method: "POST",
    headers: { "Content-Type": "application/json" },
    body: JSON.stringify({ question }),
  });
  if (!res.ok) throw new Error("ask failed " + res.status);
  return res.json();
}
async function send() {
  const input = document.getElementById("input");
  const question = input.value.trim();
  if (!question) return;
  input.value = "";
  autoGrow();

  const conv = getActive();
  conv.messages.push({ role: "user", text: question });
  if (!conv.title) conv.title = question.slice(0, 48);
  save();

  renderThread(conv.messages);
  const thread = document.getElementById("thread");
  thread.insertAdjacentHTML("beforeend", `<div class="msg-assistant typing-wrap"><div class="assistant-head"><div class="assistant-mark">✦</div><span class="assistant-name">Luna</span></div><div class="typing"><span></span><span></span><span></span></div></div>`);
  thread.parentElement.scrollTop = thread.parentElement.scrollHeight;
  setSendEnabled(false);

  try {
    const data = await ask(question);
    conv.messages.push({ role: "assistant", text: data.answer, refused: data.refused });
    if (data.refused) conv.title = conv.title || "Refused";
    save();
    document.querySelector(".typing-wrap")?.remove();
    renderThread(conv.messages);
    renderHistory();
  } catch (err) {
    document.querySelector(".typing-wrap")?.remove();
    toast("Error: " + err.message);
  } finally {
    setSendEnabled(true);
  }
}

/* ---------- ingest ---------- */
function toast(msg) {
  const el = document.getElementById("ingestToast");
  el.textContent = msg;
  el.style.display = "block";
  setTimeout(() => (el.style.display = "none"), 6000);
}
async function uploadFiles(files) {
  if (!files.length) return;
  const fd = new FormData();
  for (const f of files) fd.append("files", f);
  toast("Ingesting…");
  try {
    const res = await fetch("/api/ingest", { method: "POST", body: fd });
    const data = await res.json();
    if (!data.ok) { toast("Ingest failed: " + JSON.stringify(data.report)); return; }
    const r = data.report;
    const lines = r.files.map(f => `${f.name}: ${f.status} (${f.chunks} chunks, ${f.blocked} blocked, ${f.redacted} redacted)`);
    toast("✓ Ingested: " + lines.join(" · "));
  } catch (err) {
    toast("Ingest error: " + err.message);
  }
}

/* ---------- helpers ---------- */
function setSendEnabled(v) {
  document.getElementById("sendBtn").disabled = !v;
}
function autoGrow() {
  const t = document.getElementById("input");
  t.style.height = "auto";
  t.style.height = Math.min(t.scrollHeight, 160) + "px";
}

/* ---------- events ---------- */
document.getElementById("sendBtn").addEventListener("click", send);
document.getElementById("input").addEventListener("keydown", e => {
  if (e.key === "Enter" && !e.shiftKey) { e.preventDefault(); send(); }
});
document.getElementById("input").addEventListener("input", autoGrow);
document.getElementById("newChat").addEventListener("click", newConversation);
document.getElementById("hamburger").addEventListener("click", () => document.getElementById("sidebar").classList.toggle("open"));
document.getElementById("ingestBtn").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("attachBtn").addEventListener("click", () => document.getElementById("fileInput").click());
document.getElementById("fileInput").addEventListener("change", e => { uploadFiles([...e.target.files]); e.target.value = ""; });
document.addEventListener("keydown", e => {
  if ((e.metaKey || e.ctrlKey) && e.key.toLowerCase() === "n") { e.preventDefault(); newConversation(); }
});
document.getElementById("chatSearch").addEventListener("input", e => {
  const q = e.target.value.toLowerCase();
  document.querySelectorAll(".chat-row").forEach(row => {
    row.style.display = row.textContent.toLowerCase().includes(q) ? "" : "none";
  });
});

/* ---------- init ---------- */
newConversation();
</script>
